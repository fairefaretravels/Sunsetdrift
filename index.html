<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sunset Slide</title>
<style>
:root{--bg:#fff1e6;--fg:#2a1650;--ac:#ff4f8b;--card:#fffffff0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0618;--fg:#ffe9f5;--card:#1a0f33f0}}
:root[data-theme="dark"]{--bg:#0b0618;--fg:#ffe9f5;--card:#1a0f33f0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:inherit}
body{margin:0;padding:12px;background:var(--bg);color:var(--fg);font:16px/1.4 "Trebuchet MS",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:10px}
#wrap{position:relative;width:100%;max-width:900px}
canvas{width:100%;display:block;aspect-ratio:16/9;border-radius:14px;background:#000;touch-action:none}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:12px}
#card{background:var(--card);border-radius:14px;padding:18px 22px;text-align:center;max-width:420px}
h1{margin:0 0 6px;font-size:clamp(24px,5vw,38px);letter-spacing:.5px}
p{margin:6px 0}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:10px 20px;background:var(--ac);color:#fff;cursor:pointer}
button:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
#tb{display:flex;gap:10px;width:100%;max-width:900px;justify-content:center}
#tb button{flex:1;max-width:200px;touch-action:none;user-select:none}
small{opacity:.75;text-align:center}
</style></head><body>
<div id="wrap"><canvas id="c"></canvas>
<div id="ov"><div id="card"><h1>Sunset Drift</h1>
<p>Bomb the hill on a longboard. Dodge traffic, grab bits, and drift for boosts.</p>
<p><small>Steer: arrows or A/D, or drag on screen.<br>Drift: hold Space or Shift. Jump: W or Up.</small></p>
<button id="go">Start drift</button> <button id="rd">Rider: Cat</button></div></div></div>
<div id="tb"><button id="bj">Jump</button><button id="bd">Drift (hold)</button><button id="br">Radio: start</button></div>
<small>Release a long drift to fire a boost. Three crashes and the ride ends.</small>
<script>
(()=>{
const cv=document.getElementById('c'),g=cv.getContext('2d'),W=640,H=360,HOR=152,D=60,RW=W*.34;
cv.width=W;cv.height=H;
const seed=Math.random()*100,cur=z=>Math.sin(z*.0011+seed)+.6*Math.sin(z*.0029+seed*2);
const hash=n=>{const s=Math.sin(n*127.1)*43758.5;return s-Math.floor(s)};
const ST=[
{n:'Sunset Peaks',t:'#2b1055',b:'#ff7a8a',sun:'#ffd36b',g:['#4a2a7a','#3f236b'],r:['#4a4466','#433d5e'],m:'#1d1040',k:0},
{n:'Midnight City',t:'#04021a',b:'#5a1d84',sun:'#ff3df2',g:['#140f33','#100b2a'],r:['#25203c','#201b35'],m:'#0b0720',k:1},
{n:'Sunrise Beach',t:'#ff9a8b',b:'#ffe7a8',sun:'#fff6c2',g:['#f3d49a','#ebc88a'],r:['#68627f','#605a78'],m:'#e79a9a',k:2}];
const gr=ST.map(s=>{const q=g.createLinearGradient(0,0,0,HOR);q.addColorStop(0,s.t);q.addColorStop(1,s.b);return q});
const CC=['#ff4f8b','#35d0ff','#ffd23f','#7bff8a','#b583ff'];
let S,mode='title',rider=0,keys={},ptr=null,last=0,best=0,c0=0;
try{best=+localStorage.getItem('ss_best')||0}catch(e){}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function reset(){S={pos:0,spd:230,px:0,vx:0,jy:0,jv:0,lives:3,bits:0,score:0,dm:0,boost:0,inv:0,shake:0,t:0,nz:700,obj:[],sp:[],stage:0,ban:2.5,fade:1,toast:null}}
reset();
function jump(){if(mode==='play'&&S.jy===0)S.jv=330}
function start(){reset();mode='play';if(!asked){asked=1;setRadio(true)}document.getElementById('ov').style.display='none'}
document.getElementById('go').onclick=start;
function swap(){rider=1-rider;document.querySelectorAll('#rd').forEach(b=>b.textContent='Rider: '+(rider?'Avatar':'Raccoon'))}
document.getElementById('rd').onclick=swap;
addEventListener('keydown',e=>{keys[e.code]=1;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
 if(e.code==='Enter'&&mode!=='play')start();if(e.code==='KeyC')swap();if(e.code==='ArrowUp'||e.code==='KeyW')jump()});
addEventListener('keyup',e=>keys[e.code]=0);
const pp=e=>{const r=cv.getBoundingClientRect();ptr=((e.clientX-r.left)/r.width*W-W/2)/RW};
cv.addEventListener('pointerdown',e=>{pp(e);cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(ptr!==null)pp(e)});
['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,()=>ptr=null));
const bj=document.getElementById('bj'),bd=document.getElementById('bd');
bj.addEventListener('pointerdown',e=>{e.preventDefault();jump()});
bd.addEventListener('pointerdown',e=>{e.preventDefault();keys.drift=1});
['pointerup','pointerleave','pointercancel'].forEach(n=>bd.addEventListener(n,()=>keys.drift=0));

const br=document.getElementById('br');let radio=null,on=false,asked=0;
function setRadio(v){on=v;br.textContent='Radio: '+(v?'on':'off');
 if(v){if(!radio){radio=new Audio('https://listen.streamaudio.co/proxy/mackinthedark/stream');radio.onerror=()=>{on=false;radio=null;br.textContent='Radio unavailable'}}
  radio.play().catch(()=>{on=false;br.textContent='Radio unavailable'})}
 else if(radio){radio.pause();radio.removeAttribute('src');radio.load();radio=null}}
br.onclick=()=>setRadio(!on);
function spawn(){
 const s=S,z=s.nz,lanes=[-.7,-.23,.23,.7];
 if(Math.random()<.55){
  const n=Math.random()<.35?2:1,pool=lanes.slice();
  for(let i=0;i<n;i++){const x=pool.splice(Math.floor(Math.random()*pool.length),1)[0];
   s.obj.push({k:'car',z:z+i*40,x,s:110+Math.random()*110,c:CC[Math.floor(Math.random()*CC.length)],ok:0})}
 }else{
  const x=(Math.random()*1.5-.75);
  for(let i=0;i<5;i++)s.obj.push({k:'bit',z:z+i*70,x:x+Math.sin(i*.9)*.12});
 }
 s.nz+=Math.max(220,540-s.pos/100);
}
function crash(c){
 const s=S;c.dead=1;s.lives--;s.spd*=.35;s.inv=1.6;s.shake=.4;s.vx=(Math.random()<.5?-1:1)*1.4;s.dm=0;
 if(s.lives<=0){
  mode='over';const sc=Math.floor(s.score);
  if(sc>best){best=sc;try{localStorage.setItem('ss_best',best)}catch(e){}}
  const ov=document.getElementById('ov');ov.style.display='flex';
  document.getElementById('card').innerHTML='<h1>Wiped out</h1><p>Score '+sc+' &nbsp; Bits '+s.bits+' &nbsp; Best '+best+'</p><p>Distance '+Math.floor(s.pos/100)+' m</p><button id="go">Ride again</button> <button id="rd">Rider: '+(rider?'Avatar':'Raccoon')+'</button>';
  document.getElementById('go').onclick=start;document.getElementById('rd').onclick=swap;
 }
}
function upd(dt){
 const s=S;s.t+=dt;
 const dr=!!(keys.Space||keys.ShiftLeft||keys.ShiftRight||keys.ArrowDown||keys.drift);
 let st=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0);
 if(ptr!==null)st=clamp((ptr-s.px)*3,-1,1);
 s.vx+=(st*(dr?2.1:1.5)-s.vx)*Math.min(1,(dr?1.7:7)*dt);
 const dc=cur(s.pos+90)-cur(s.pos);
 s.px=clamp(s.px+s.vx*dt*.8-dc*s.spd*dt*.006,-1.2,1.2);
 if(Math.abs(s.px)>.95)s.spd*=1-1.2*dt;
 if(dr&&Math.abs(s.vx)>.7&&s.jy===0){
  s.dm=Math.min(1,s.dm+dt*.6);
  if(Math.random()<.6)s.sp.push({x:W/2+s.px*RW,y:H-52,vx:(Math.random()-.5)*90-s.vx*40,vy:-30-Math.random()*60,l:.4});
 }else if(!dr&&s.dm>0){
  if(s.dm>.3){s.boost=1+s.dm*1.5;const b=Math.round(s.dm*300);s.score+=b;s.toast={t:'Drift boost +'+b,l:1.4}}
  s.dm=0;
 }
 if(s.boost>0)s.boost-=dt;
 const tg=Math.min(540,240+s.t*3.2)+(s.boost>0?170:0);
 s.spd+=(tg-s.spd)*Math.min(1,dt*(tg>s.spd?.9:2.5));
 s.pos+=s.spd*dt;s.score+=s.spd*dt*.02;
 if(s.jv||s.jy){s.jy+=s.jv*dt;s.jv-=900*dt;if(s.jy<=0){s.jy=0;s.jv=0}}
 s.inv=Math.max(0,s.inv-dt);s.shake=Math.max(0,s.shake-dt);s.ban=Math.max(0,s.ban-dt);s.fade=Math.max(0,s.fade-dt*1.2);
 if(s.toast&&(s.toast.l-=dt)<=0)s.toast=null;
 const sg=Math.floor(s.pos/12000)%3;if(sg!==s.stage){s.stage=sg;s.ban=2.5;s.fade=1}
 while(s.nz<s.pos+4500)spawn();
 for(const o of s.obj){
  if(o.k==='car')o.z+=o.s*dt;
  const dz=o.z-s.pos;
  if(dz>D-12&&dz<D+12&&!o.dead){
   const dx=Math.abs(o.x-s.px);
   if(o.k==='bit'&&dx<.2&&s.jy<30){o.dead=1;s.bits++;s.score+=10}
   else if(o.k==='car'&&dx<.3){
    if(s.jy>20){if(!o.ok){o.ok=1;s.score+=50;s.toast={t:'Air +50',l:1}}}
    else if(s.inv<=0)crash(o);
   }
  }
 }
 s.obj=s.obj.filter(o=>!o.dead&&o.z>s.pos+D-40);
 for(const p of s.sp){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*dt;p.l-=dt}
 s.sp=s.sp.filter(p=>p.l>0);
}
function sky(k){
 const p=ST[k],sh=c0*60;
 g.fillStyle=gr[k];g.fillRect(0,0,W,HOR+1);
 const sx=W/2-sh*.25;
 g.fillStyle=p.sun;g.globalAlpha=.25;g.beginPath();g.arc(sx,HOR-38,64,0,7);g.fill();g.globalAlpha=1;
 g.beginPath();g.arc(sx,HOR-38,46,0,7);g.fill();
 g.fillStyle=p.m;
 if(p.k===1){
  const off=((sh%28)+28)%28,i0=Math.floor(sh/28);
  for(let x=-28,i=i0-1;x<W+28;x+=28,i++){const h=18+hash(i)*70;g.fillRect(x-off,HOR-h,26,h);
   g.fillStyle='#ffd23f';for(let w=0;w<3;w++)if(hash(i*7+w)>.55)g.fillRect(x-off+4+w*7,HOR-h+6+hash(i+w)*h*.6,3,3);g.fillStyle=p.m}
 }else{
  const sc=p.k===2?.35:1;
  g.beginPath();g.moveTo(0,HOR);
  for(let x=0;x<=W;x+=6){const ph=(x+sh)*.012;g.lineTo(x,HOR-sc*(40+30*Math.abs(Math.sin(ph))+14*Math.sin(ph*2.7)))}
  g.lineTo(W,HOR);g.fill();
  if(p.k===2){g.fillStyle='#3fb7c9';g.fillRect(0,HOR-9,W,10)}
 }
}
function proj(z){const dz=z-S.pos,tp=D/dz;return{tp,y:HOR+tp*(H-HOR),x:W/2+(cur(S.pos+Math.min(dz,3000))-c0)*Math.pow(1-Math.min(tp,1),2)*W*.1}}
function car(o){
 const q=proj(o.z);if(q.tp>1.6||q.tp<.012)return;
 const w=RW*.34*q.tp,h=w*.62,x=q.x+o.x*RW*q.tp,y=q.y;
 g.fillStyle='rgba(0,0,0,.35)';g.fillRect(x-w*.55,y-h*.08,w*1.1,h*.14);
 g.fillStyle=o.c;g.fillRect(x-w/2,y-h*.72,w,h*.62);
 g.fillStyle='rgba(0,0,0,.3)';g.fillRect(x-w*.36,y-h,w*.72,h*.34);
 g.fillStyle='#bfe6ff';g.fillRect(x-w*.3,y-h*.95,w*.6,h*.24);
 g.fillStyle='#ff2a2a';g.fillRect(x-w*.46,y-h*.5,w*.2,h*.14);g.fillRect(x+w*.26,y-h*.5,w*.2,h*.14);
}
function bit(o){
 const q=proj(o.z);if(q.tp>1.6||q.tp<.012)return;
 const r=RW*.05*q.tp,x=q.x+o.x*RW*q.tp,y=q.y-r*2.4;
 g.fillStyle='#ffd23f';g.beginPath();g.ellipse(x,y,r*Math.abs(Math.cos(S.t*5+o.z*.01))+.5,r,0,0,7);g.fill();
 g.strokeStyle='#fff7c2';g.lineWidth=Math.max(1,r*.2);g.stroke();
}
function avatar(){
 const t=S.t,k='#6b4332',hr='#17100c';
 g.fillStyle='#2b1d4d';g.fillRect(-34,0,68,7);g.fillStyle='#35d0ff';g.fillRect(-34,2,68,2);
 g.fillStyle='#f2f2f2';g.beginPath();g.arc(-24,9,4,0,7);g.arc(24,9,4,0,7);g.fill();
 g.lineCap='round';g.strokeStyle=hr;g.lineWidth=2.4;
 for(let i=-6;i<=6;i++){g.beginPath();g.moveTo(i*1.6,-82);g.lineTo(i*2.6+Math.sin(t*6+i)*2.5-S.vx*2,-58+Math.abs(i)*1.2);g.stroke()}
 g.fillStyle='#0c0c10';g.fillRect(-15,-9,11,9);g.fillRect(4,-9,11,9);
 g.fillStyle='#1c1c22';g.fillRect(-13,-44,10,36);g.fillRect(3,-44,10,36);
 g.fillStyle='#2a2a31';g.fillRect(-15,-28,5,10);g.fillRect(10,-28,5,10);
 g.fillStyle='#0c0c10';g.fillRect(-14,-47,28,4);g.fillStyle='#9aa';g.fillRect(-2,-47,4,4);
 g.fillStyle=k;g.fillRect(-10,-55,20,8);
 g.fillStyle='#111';g.fillRect(-10,-61,20,7);
 g.fillStyle='#161c33';g.fillRect(-14,-66,8,16);g.fillRect(6,-66,8,16);
 g.strokeStyle='#161c33';g.lineWidth=7;g.beginPath();g.moveTo(-13,-64);g.lineTo(-25,-50);g.moveTo(13,-64);g.lineTo(25,-50);g.stroke();
 g.fillStyle='#2b2b33';g.beginPath();g.arc(-26,-48,4,0,7);g.arc(26,-48,4,0,7);g.fill();
 g.fillStyle='#fff';for(let i=0;i<18;i++)if(Math.sin(t*5+i*2.1)>.2)g.fillRect(-26+hash(i)*52,-66+hash(i+9)*18,1.5,1.5);
 g.fillStyle=k;g.fillRect(-3,-70,6,5);g.beginPath();g.arc(0,-77,8.5,0,7);g.fill();
 g.fillStyle=hr;g.beginPath();g.arc(0,-81,8.5,Math.PI,0);g.fill();
 g.fillStyle='#233a26';g.fillRect(-8,-79,7,4);g.fillRect(1,-79,7,4);g.fillRect(-1.5,-78,3,1.2);
 g.fillStyle='#9be39b';g.fillRect(-6,-78.5,2,1);g.fillRect(3,-78.5,2,1);
 g.fillStyle='#3a1620';g.fillRect(-2.5,-72,5,1.8);
 g.strokeStyle='#d8d8e0';g.lineWidth=1.2;g.beginPath();g.arc(-9.5,-72,3,0,7);g.moveTo(12.5,-72);g.arc(9.5,-72,3,0,7);g.stroke();
}
function player(){
 const s=S;if(s.inv>0&&Math.floor(s.t*16)%2)return;
 const x=W/2+s.px*RW,y=H-52;
 g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(x,y+10,34-s.jy*.1,6,0,0,7);g.fill();
 g.save();g.translate(x,y-s.jy);g.rotate(s.vx*.12);g.scale(1.2,1.2);
 if(rider){avatar();g.restore();return}
 g.fillStyle='#2b1d4d';g.fillRect(-34,0,68,7);g.fillStyle='#ff9a3c';g.fillRect(-34,2,68,2);
 g.fillStyle='#f2f2f2';g.beginPath();g.arc(-24,9,4,0,7);g.arc(24,9,4,0,7);g.fill();
 
 // Cat rider
 g.fillStyle='#77738f';
 g.fillRect(-12,-18,6,18);
 g.fillRect(6,-18,6,18);

 // Tail
 g.strokeStyle='#77738f';
 g.lineWidth=7;
 g.beginPath();
 g.moveTo(10,-25);
 g.bezierCurveTo(29,-28,27,-43,15,-39);
 g.stroke();

 // Body
 g.fillStyle='#77738f';
 g.beginPath();
 g.ellipse(0,-31,14,17,0,0,Math.PI*2);
 g.fill();

 // Head
 g.fillStyle='#aaa6c1';
 g.beginPath();
 g.arc(0,-54,14,0,Math.PI*2);
 g.fill();

 // Pointed ears
 g.beginPath();
 g.moveTo(-13,-59);
 g.lineTo(-12,-74);
 g.lineTo(-3,-65);
 g.moveTo(13,-59);
 g.lineTo(12,-74);
 g.lineTo(3,-65);
 g.fill();

 // Pink inner ears
 g.fillStyle='#ff9aaf';
 g.beginPath();
 g.moveTo(-11,-63);
 g.lineTo(-11,-70);
 g.lineTo(-6,-65);
 g.moveTo(11,-63);
 g.lineTo(11,-70);
 g.lineTo(6,-65);
 g.fill();

 // Face
 g.fillStyle='#35304b';
 g.fillRect(-13,-58,26,8);
 g.fillStyle='#aaff91';
 g.fillRect(-9,-56,7,4);
 g.fillRect(2,-56,7,4);

 // Pupils
 g.fillStyle='#111';
 g.fillRect(-6,-56,2,4);
 g.fillRect(4,-56,2,4);

 // Pink nose
 g.fillStyle='#ff8fa8';
 g.beginPath();
 g.moveTo(-3,-48);
 g.lineTo(3,-48);
 g.lineTo(0,-45);
 g.closePath();
 g.fill();

 // Whiskers
 g.strokeStyle='#eee8ff';
 g.lineWidth=1;
 g.beginPath();
 g.moveTo(-7,-48);
 g.lineTo(-19,-51);
 g.moveTo(-7,-46);
 g.lineTo(-19,-45);
 g.moveTo(7,-48);
 g.lineTo(19,-51);
 g.moveTo(7,-46);
 g.lineTo(19,-45);
 g.stroke();

 g.restore();

}
function draw(){
 const s=S,k=s.stage,p=ST[k];c0=cur(s.pos);
 g.save();
 if(s.shake>0)g.translate((Math.random()-.5)*8,(Math.random()-.5)*8);
 sky(k);
 for(let y=HOR+1;y<H;y++){
  const t=(y-HOR)/(H-HOR),dp=D/t,wz=s.pos+dp,bd=Math.floor(wz/50)&1;
  const cx=W/2+(cur(s.pos+Math.min(dp,3000))-c0)*Math.pow(1-t,2)*W*.1,hw=RW*t;
  g.fillStyle=p.g[bd];g.fillRect(0,y,W,1);
  g.fillStyle=bd?'#ff4f8b':'#fff';g.fillRect(cx-hw*1.08,y,hw*2.16,1);
  g.fillStyle=p.r[bd];g.fillRect(cx-hw,y,hw*2,1);
  if(bd){g.fillStyle='#ffffffaa';for(const l of[-.5,0,.5])g.fillRect(cx+l*hw-hw*.01,y,hw*.02,1)}
 }
 const L=s.obj.filter(o=>o.z-s.pos>D-20).sort((a,b)=>b.z-a.z);
 for(const o of L)o.k==='car'?car(o):bit(o);
 player();
 g.fillStyle='#ffd23f';for(const q of s.sp)g.fillRect(q.x,q.y,3,3);
 if(s.boost>0){g.strokeStyle='#ffffff55';g.lineWidth=1;for(let i=0;i<14;i++){const a=hash(i+Math.floor(s.t*20))*W;g.beginPath();g.moveTo(a,H*.45);g.lineTo(a+(a-W/2)*.4,H);g.stroke()}}
 g.restore();
 g.font='bold 15px "Trebuchet MS",sans-serif';g.textBaseline='top';
 const tx=(t,x,y,c,al)=>{g.textAlign=al||'left';g.fillStyle='#0008';g.fillText(t,x+1,y+1);g.fillStyle=c||'#fff';g.fillText(t,x,y)};
 tx('Score '+Math.floor(s.score),10,8);tx('Bits '+s.bits,10,28,'#ffd23f');
 tx(Math.round(s.spd*.2)+' km/h',W-10,8,'#fff','right');
 let hs='';for(let i=0;i<3;i++)hs+=i<s.lives?'♥ ':'♡ ';tx(hs,W-10,28,'#ff4f8b','right');
 g.fillStyle='#0008';g.fillRect(W/2-60,H-14,120,6);g.fillStyle='#ff9a3c';g.fillRect(W/2-60,H-14,120*s.dm,6);
 g.font='bold 26px "Trebuchet MS",sans-serif';
 if(s.ban>0){g.globalAlpha=Math.min(1,s.ban);tx(p.n,W/2,70,'#fff','center');g.globalAlpha=1}
 if(s.toast){g.font='bold 18px "Trebuchet MS",sans-serif';g.globalAlpha=Math.min(1,s.toast.l);tx(s.toast.t,W/2,110,'#ffd23f','center');g.globalAlpha=1}
 if(s.fade>0){g.fillStyle='rgba(0,0,0,'+s.fade+')';g.fillRect(0,0,W,H)}
}
function loop(ts){
 const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
 if(mode==='play')upd(dt);else{S.pos+=160*dt;S.t+=dt;S.fade=0;S.ban=0;S.px=Math.sin(S.t*.6)*.4}
 draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script></body></html>
